name: news-bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          mkdir -p state
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state"
            git pull --rebase -q || true
            git push -q
          fi
